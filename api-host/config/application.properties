# Defaults of the serverless host. Spring Boot reads ./config/application.properties from the
# working directory of the process (the package root). An app setting (environment variable)
# with the same meaning wins over a line here, for example SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE.
# No secret belongs in this file: DB_URL, DB_USERNAME and DB_PASSWORD come from app settings.

# Small pool: each function instance has its own pool and the database is a B1ms (about 50 connections).
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=300000
spring.datasource.hikari.connection-timeout=10000

# The schema migration runs at start, the same as on AKS.
spring.flyway.enabled=true

# No poller on a function instance: it is frozen between requests. The AKS host runs the relay.
consignado.outbox.relay.enabled=false
